name: Generator-Basisprüfung
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python scripts/check.py
      - run: python -m unittest discover -s .github/template-tests -v
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --no-deps .
      - run: t0004-generator version
      - run: t0004-generator check
      - run: t0004-generator plan
      - run: t0004-generator new
