name: Generator-Basisprüfung
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - run: python -m pip install --no-deps .
      - run: t0004-generator version
      - run: t0004-generator check
      - run: t0004-generator plan
      - run: t0004-generator new
      - run: t0004-generator migrate --json
      - name: Fetch pinned public candidate template (credential-free)
        id: prepare_candidate
        env:
          T0004_T0003_CANDIDATE_MIRROR: ${{ runner.temp }}/t0003-candidate.git
        run: python scripts/prepare_candidate_ci.py
      - name: Repository and public integration verification
        env:
          T0004_T0003_MIRROR: ${{ steps.prepare_candidate.outputs.candidate_mirror }}
          T0004_T0003_CANDIDATE_MIRROR: ${{ steps.prepare_candidate.outputs.candidate_mirror }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify.py --json | tee "${RUNNER_TEMP}/verification-${RUNNER_OS}.json"
      - name: Upload platform verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ runner.os }}
          path: ${{ runner.temp }}/verification-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fetch pinned template refs (manual main only)
        id: prepare_template
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.T0003_READ_TOKEN }}
          T0004_T0003_MIRROR: ${{ runner.temp }}/t0003-template.git
        run: python scripts/prepare_template_ci.py
      - name: Report private auth not verified on standard main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -c "print('Private template authentication: NOT VERIFIED (standard main push). Manual authenticated validation requires workflow_dispatch on main.')"
      - name: Report template checks not verified for untrusted events
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python scripts/prepare_template_ci.py --untrusted
      - name: Integration suite
        if: steps.prepare_template.outputs.template_ready == 'true'
        env:
          T0004_T0003_MIRROR: ${{ steps.prepare_template.outputs.mirror }}
          T0004_T0003_CANDIDATE_MIRROR: ${{ steps.prepare_candidate.outputs.candidate_mirror }}
          T0004_SKIP_CANDIDATE_INTEGRATION: "1"
        run: python -m unittest discover -s integration -v

  release-readiness:
    if: always()
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download platform verification reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-*
          path: verification-reports
          merge-multiple: true
      - name: Aggregate release readiness
        run: >-
          python scripts/verify.py --aggregate
          verification-reports/verification-Linux.json
          verification-reports/verification-Windows.json --json
