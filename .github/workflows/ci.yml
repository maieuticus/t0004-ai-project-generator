name: Generator-Basisprüfung
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - run: python scripts/check.py
      - run: python -m unittest discover -s .github/template-tests -v
      - name: Generator and local fixture tests
        run: python -m unittest discover -s tests -v
      - run: python -m pip install --no-deps .
      - run: t0004-generator version
      - run: t0004-generator check
      - run: t0004-generator plan
      - run: t0004-generator new
      - run: t0004-generator migrate --json
      - name: Fetch pinned template refs (manual main only)
        id: prepare_template
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.T0003_READ_TOKEN }}
          T0004_T0003_MIRROR: ${{ runner.temp }}/t0003-template.git
        run: python scripts/prepare_template_ci.py
      - name: Report private auth not verified on standard main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -c "print('Private template authentication: NOT VERIFIED (standard main push). Manual authenticated validation requires workflow_dispatch on main.')"
      - name: Report template checks not verified for untrusted events
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python scripts/prepare_template_ci.py --untrusted
      - name: Integration suite
        if: steps.prepare_template.outputs.template_ready == 'true'
        env:
          T0004_T0003_MIRROR: ${{ steps.prepare_template.outputs.mirror }}
        run: python -m unittest discover -s integration -v
