name: Docker validation
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps .
      - run: python scripts/docker_ci.py
  docker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -p test_infrastructure.py -v
      - run: python scripts/docker_ci.py --config-only
