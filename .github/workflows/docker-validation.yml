name: Docker validation
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps .
      - name: Fetch pinned template refs (trusted push only)
        id: prepare_template
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.T0003_READ_TOKEN }}
          T0004_T0003_MIRROR: ${{ runner.temp }}/t0003-template.git
        run: python scripts/prepare_template_ci.py
      - name: Report template checks not verified for untrusted events
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python scripts/prepare_template_ci.py --untrusted
      - name: Docker validation
        if: steps.prepare_template.outputs.template_ready == 'true'
        env:
          T0004_T0003_MIRROR: ${{ steps.prepare_template.outputs.mirror }}
        run: python scripts/docker_ci.py
  docker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -p test_infrastructure.py -v
      - name: Fetch pinned template refs (trusted push only)
        id: prepare_template
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.T0003_READ_TOKEN }}
          T0004_T0003_MIRROR: ${{ runner.temp }}/t0003-template.git
        run: python scripts/prepare_template_ci.py
      - name: Report template checks not verified for untrusted events
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python scripts/prepare_template_ci.py --untrusted
      - name: Docker configuration validation
        if: steps.prepare_template.outputs.template_ready == 'true'
        env:
          T0004_T0003_MIRROR: ${{ steps.prepare_template.outputs.mirror }}
        run: python scripts/docker_ci.py --config-only
