[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t0004-ai-project-generator"
dynamic = ["version"]
description = "Safe dry-run core for the t0004 project generator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
t0004-generator = "project_generator.cli:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_generator = [
  "templates/baseline/AGENTS.md",
  "templates/baseline/config/*.yaml",
  "templates/baseline/docs/*.md",
  "templates/baseline/scripts/*.py",
  "templates/typescript/.gitignore",
  "templates/typescript/package.json",
  "templates/typescript/package-lock.json",
  "templates/typescript/tsconfig.json",
  "templates/typescript/src/*.ts",
  "templates/typescript/test/*.mjs",
  "templates/typescript/docs/*.md",
  "templates/react/.gitignore",
  "templates/react/index.html",
  "templates/react/package.json",
  "templates/react/package-lock.json",
  "templates/react/tsconfig.json",
  "templates/react/vite.config.ts",
  "templates/react/src/*.tsx",
  "templates/react/src/*.ts",
  "templates/react/src/*.css",
  "templates/react/test/*.mjs",
  "templates/react/docs/*.md",
  "templates/java/.gitignore",
  "templates/java/pom.xml",
  "templates/java/mvnw",
  "templates/java/mvnw.cmd",
  "templates/java/.mvn/wrapper/*.properties",
  "templates/java/src/main/java/org/example/app/*.java",
  "templates/java/src/test/java/org/example/app/*.java",
  "templates/java/docs/*.md",
]
